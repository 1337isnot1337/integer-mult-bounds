name: Connector caller exhaustion audit
on:
  pull_request:
    paths:
      - 'research/connector-caller-exhaustion-audit/**'
      - 'research/connector-covering-code/cycle_search.cpp'
      - 'research/connector-covering-code/verify_cycles.py'
      - 'research/connector-covering-code/README.md'
      - '.github/workflows/connector-caller-exhaustion-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-caller:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Registered gap and caller audit
        run: |
          g++ --version
          python -I -W error -B scripts/research_package.py --package research/connector-caller-exhaustion-audit
      - name: Address and undefined-behavior traversal controls
        env:
          CXX: g++ -fsanitize=address,undefined -fno-omit-frame-pointer
        run: python -I -O -W error -B research/connector-caller-exhaustion-audit/verify.py
