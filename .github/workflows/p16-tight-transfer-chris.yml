name: P16 independent exact tighter κ transfer
on:
  push:
    branches:
      - research/p16-tight-transfer-upstream-clean-20261022
  pull_request:
    paths:
      - 'research/p16-tight-transfer-20261022/**'
      - '.github/workflows/p16-tight-transfer-chris.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-conditional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check exact source-selected raw rank moments
        run: python -I -B research/p16-tight-transfer-20261022/frontier_rational_gate.py
      - name: Certify κ=0.0030201659769 with all 54+4 gates and fixed rank
        run: python -I -B research/p16-tight-transfer-20261022/critical_root_tight_transfer.py
