name: P112 common-deletion slice

on:
  pull_request:
    paths:
      - 'research/p112-common-deletion-slice/**'
      - '.github/workflows/p112-common-slice.yml'
  push:
    branches: [main]
    paths:
      - 'research/p112-common-deletion-slice/**'
      - '.github/workflows/p112-common-slice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-slice:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TMPDIR: ${{ runner.temp }}/p112-common-slice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native checker dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ libboost-dev
          mkdir -p "$TMPDIR"
          g++ --version
          python --version
      - name: Replay the complete slice
        run: python -B research/p112-common-deletion-slice/verify.py
      - name: Run boundary and semantic controls
        run: python -O -B research/p112-common-deletion-slice/test_verify.py
