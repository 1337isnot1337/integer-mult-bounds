name: GL3 native RUP replay
on:
  pull_request:
    paths:
      - 'research/gl3-rup-native-replay/**'
      - '.github/workflows/gl3-rup-native-replay.yml'
  push:
    branches: [main]
    paths:
      - 'research/gl3-rup-native-replay/**'
      - '.github/workflows/gl3-rup-native-replay.yml'
permissions:
  contents: read
jobs:
  native-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile and replay the unchanged certificates with controls
        run: python -I -B research/gl3-rup-native-replay/native_replay.py --output "$RUNNER_TEMP/gl3-rup-native"
      - name: Compare all proof-relevant fields and retain raw logs in job output
        run: |
          python -I -B research/gl3-rup-native-replay/verify.py --native-receipt "$RUNNER_TEMP/gl3-rup-native/RESULT.json"
          find "$RUNNER_TEMP/gl3-rup-native" -maxdepth 1 -name '*.log' -print -exec cat {} \;
      - name: Committed inputs remain unchanged
        run: git diff --exit-code
