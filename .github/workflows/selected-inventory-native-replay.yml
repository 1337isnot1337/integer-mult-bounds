name: Selected inventory native replay
on:
  push:
    branches: ['codex/**']
    paths:
      - 'research/selected-inventory-native-replay/**'
      - '.github/workflows/selected-inventory-native-replay.yml'
  pull_request:
    paths:
      - 'research/selected-inventory-native-replay/**'
      - '.github/workflows/selected-inventory-native-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Alias, source drift and retained-budget controls
        run: python -I -B research/selected-inventory-native-replay/test_adapter.py
      - name: Complete source-inventory replay
        run: python -I -B research/selected-inventory-native-replay/verify.py
      - name: Optimized-interpreter controls and complete replay
        run: |
          python -I -O -B research/selected-inventory-native-replay/test_adapter.py
          python -I -O -B research/selected-inventory-native-replay/verify.py
